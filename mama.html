<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PP Neue Machina Font</title>
    <style>
        /* 1. Font ko add karein */
        @font-face {
            font-family: 'PP Neue Machina';
            src: url('PPNeueMachina-Regular.woff2') format('woff2'); /* Apne font file ka sahi path dalein */
            font-weight: normal;
            font-style: normal;
        }

        /* 2. Font ko apply karein */
        body {
            font-family: 'PP Neue Machina', sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }
    </style>
</head>
<body>

    <h1>Hello, World!</h1>
    <p>Ye website PP Neue Machina font use kar rahi hai.</p>

</body>
</html>
